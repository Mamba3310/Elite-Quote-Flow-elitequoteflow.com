name = "quoteflow"
main = "worker/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 9 * * *"]

[[kv_namespaces]]
binding = "BOOKING_RATE_LIMITER"
name = "BOOKING_RATE_LIMITER"
id = "00000000000000000000000000000000"

[[kv_namespaces]]
binding = "REVIEW_RATE_LIMITER"
name = "REVIEW_RATE_LIMITER"
id = "00000000000000000000000000000000"

[ai]
binding = "AI"

[vars]
PUBLIC_APP_URL = "https://elitequoteflow.com"

[env.staging]
name = "quoteflow-staging"
workers_dev = true

[env.staging.vars]
PUBLIC_APP_URL = "https://staging.elitequoteflow.com"
DISABLE_SCHEDULED_JOBS = "true"

[[env.staging.kv_namespaces]]
binding = "BOOKING_RATE_LIMITER"
id = "00000000000000000000000000000001"

[[env.staging.kv_namespaces]]
binding = "REVIEW_RATE_LIMITER"
id = "00000000000000000000000000000001"

[env.staging.ai]
binding = "AI"
