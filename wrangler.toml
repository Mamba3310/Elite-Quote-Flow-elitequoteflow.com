name = "quoteflow"
main = "worker/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 9 * * *"]

# Rate Limiting API bindings (not KV). namespace_id is an account-local integer string.
[[ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REVIEW_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[ai]
binding = "AI"

[vars]
PUBLIC_APP_URL = "https://elitequoteflow.com"

[env.staging]
name = "quoteflow-staging"
workers_dev = true

[env.staging.vars]
PUBLIC_APP_URL = "https://staging.elitequoteflow.com"
DISABLE_SCHEDULED_JOBS = "true"

[[env.staging.ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "REVIEW_RATE_LIMITER"
namespace_id = "1102"
simple = { limit = 3, period = 60 }

[env.staging.ai]
binding = "AI"
